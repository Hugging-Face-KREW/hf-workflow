version: 1

# Adapted from skills/quality/configs/style_policy.yml for the HF transformers
# technical-docs profile. Only the keys the harness parser actually reads are
# meaningful (see docs/quality-harness-architecture.md §4-B):
#   review_rules.emoji.forbid_added_emoji
#   review_rules.list_consistency.enabled
#   review_rules.alt_text.require_korean_when_source_english
#   first_mention_terms.<term>.{ko, required_first}
#   list items under modal_strength.source_terms / overstatement.risky_pairs /
#   translationese.discouraged / title_quality.discouraged
# Everything else here is documentation only.

style_guide:
  guide_path: skills/quality-transformers/style/hf-transformers-ko-translation-guide.md

hard_gate_rules:
  preserve_inline_code: true
  preserve_link_targets: true
  preserve_image_paths: true
  preserve_numbers: true
  preserve_model_ids: true
  preserve_table_shape: true
  preserve_heading_anchors: true
  preserve_heading_levels: true
  preserve_docbuilder_directives: true
  preserve_autodoc_references: true
  preserve_mdx_components: true

review_rules:
  modal_strength:
    source_terms:
      may:
        - "수 있습니다"
        - "일 수 있습니다"
      can:
        - "수 있습니다"
      should:
        - "좋습니다"
        - "해야 합니다"
      must:
        - "반드시"
        - "해야 합니다"
      up to:
        - "최대"
      in some cases:
        - "일부 경우"
      not always:
        - "항상"
        - "것은 아닙니다"
  # `experimental` / `deprecated` warning strength is enforced by the MQM
  # judge prompt, not here — a deterministic phrase check produced too many
  # false positives on dense technical prose during Phase 5 calibration.
  overstatement:
    risky_pairs:
      can improve:
        - "개선합니다"
      may improve:
        - "개선합니다"
      up to:
        - "까지"
      state-of-the-art:
        - "최강"
        - "역대 최고"
  translationese:
    discouraged:
      - "에 의해"
      - "하는 것에 있어"
      - "를 가지"
      - "을 가지"
      - "사용되어질"
      - "로 하여금"
      - "을 가능하게 합니다"
      - "를 가능하게 합니다"
      - "후드 아래"
      - "박스 밖"
  emoji:
    forbid_added_emoji: true
  list_consistency:
    enabled: true
  alt_text:
    require_korean_when_source_english: true

first_mention_terms:
  fine-tuning:
    ko: "미세 조정"
    required_first: "미세 조정(fine-tuning)"
  checkpoint:
    ko: "체크포인트"
    required_first: "체크포인트(checkpoint)"
  quantization:
    ko: "양자화"
    required_first: "양자화(quantization)"
  inference:
    ko: "추론"
    required_first: "추론(inference)"
  attention:
    ko: "어텐션"
    required_first: "어텐션(attention)"
  serving:
    ko: "서빙"
    required_first: "서빙(serving)"
  latency:
    ko: "지연 시간"
    required_first: "지연 시간(latency)"
  throughput:
    ko: "처리량"
    required_first: "처리량(throughput)"

# Documentation only (harness does not read style_score.*). style_locale
# penalty weights live in translation_quality_harness.py:style_penalty.
style_score:
  max_penalty:
    modal_strength: 20
    overstatement: 20
    translationese: 10
    list_consistency: 5
    emoji: 5
    alt_text: 5
    sentence_final_colon: 20
