name: 기능 제안
description: 해결하려는 문제와 완료 조건이 있는 기능을 제안해 주세요.
title: "[기능] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 현재 누가 어떤 상황에서 어려움을 겪는지 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 원하는 결과
      description: 구현 방법보다 사용자가 얻게 될 동작을 중심으로 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 구현 제안
      description: 고려한 흐름, 인터페이스, 대안이 있다면 적어 주세요.
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 관련 자료
      description: 관련 PR, 이슈, 실행 결과 또는 문서를 링크해 주세요.
  - type: checkboxes
    id: checks
    attributes:
      label: 확인 사항
      options:
        - label: 동일하거나 유사한 이슈를 검색했습니다.
          required: true
        - label: 이 기능이 hf-workflow의 범위에 포함되는 이유를 설명했습니다.
          required: true
