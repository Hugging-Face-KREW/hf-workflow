name: 번역 요청
description: 번역을 원하는 공개 Hugging Face Blog 글을 제안해 주세요.
title: "[번역 요청] "
labels: ["translation-request"]
body:
  - type: markdown
    attributes:
      value: 공개된 Hugging Face Blog 글만 요청해 주세요. 비밀키와 개인정보는 입력하지 마세요.
  - type: input
    id: source_url
    attributes:
      label: 원문 URL
      description: https://huggingface.co/blog/ 로 시작하는 공개 글 URL을 입력해 주세요.
      placeholder: https://huggingface.co/blog/example
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 요청 이유와 기대 독자
      description: 이 번역이 누구에게 어떤 도움을 주는지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: terminology
    attributes:
      label: 관련 한국어 자료 또는 선호 용어
      description: 참고할 번역, glossary, 시리즈 글이 있다면 링크해 주세요.
  - type: dropdown
    id: priority
    attributes:
      label: 희망 우선순위
      description: 운영 상황에 따라 실제 처리 순서는 달라질 수 있습니다.
      options:
        - 보통
        - 행사·학습 일정과 관련 있음
        - 시리즈의 다른 글과 함께 필요함
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 확인 사항
      options:
        - label: KREW 사이트의 기존 게시글과 열린 PR·이슈에서 같은 글을 검색했습니다.
          required: true
        - label: 원문이 로그인 없이 접근 가능한 공개 Hugging Face Blog 글임을 확인했습니다.
          required: true
