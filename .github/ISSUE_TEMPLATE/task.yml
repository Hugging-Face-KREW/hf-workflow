name: 작업 제안
description: 조사, 운영, 리팩터링 등 완료 가능한 작업을 제안해 주세요.
title: "[작업] "
labels: []
body:
  - type: textarea
    id: background
    attributes:
      label: 배경
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 이 이슈에서 할 일과 제외할 일을 명확히 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: deliverables
    attributes:
      label: 산출물
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: 검증 방법
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: 관련 이슈와 PR
