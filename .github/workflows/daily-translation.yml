name: Daily HF Blog Translation

on:
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Target date in Asia/Seoul, YYYY-MM-DD. Empty means today."
        required: false
        type: string
      post_url:
        description: "Optional single Hugging Face Blog URL."
        required: false
        type: string
      dry_run:
        description: "Find posts without creating translation PRs."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  translate-and-review:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6-luna
      LLM_JUDGE_MODEL: gpt-5.6-luna
      SEO_OPENAI_REQUIRED: "1"
      BOT_TOKEN: ${{ secrets.KREW_BOT_TOKEN }}
      GH_TOKEN: ${{ secrets.KREW_BOT_TOKEN }}
      KREW_REPO: Hugging-Face-KREW/hugging-face-krew.github.io
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      QUALITY_LLM_JUDGE_PROVIDER: ${{ vars.QUALITY_LLM_JUDGE_PROVIDER || 'off' }}
      QUALITY_LLM_JUDGE_MAX_SEGMENTS: ${{ vars.QUALITY_LLM_JUDGE_MAX_SEGMENTS || '0' }}
      QUALITY_LLM_JUDGE_MAX_CONCURRENCY: ${{ vars.QUALITY_LLM_JUDGE_MAX_CONCURRENCY || '4' }}

    steps:
      - name: Checkout hf workflow
        uses: actions/checkout@v4

      - name: Set target date
        id: date
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            echo "value=${{ inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(TZ=Asia/Seoul date -d 'yesterday' +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install translation-flow dependencies
        run: python -m pip install -e "translation-flow[dev]"

      - name: Clone target KREW blog repo
        run: |
          if [ -z "${BOT_TOKEN}" ]; then
            echo "KREW_BOT_TOKEN secret is missing or empty."
            exit 1
          fi
          git clone "https://x-access-token:${BOT_TOKEN}@github.com/${KREW_REPO}.git" target-repo
          git -C target-repo config user.email "github-actions[bot]@users.noreply.github.com"
          git -C target-repo config user.name "github-actions[bot]"

      - name: Ensure HF agent labels exist
        run: |
          gh label create "hf-agent:managed" \
            --repo "${KREW_REPO}" \
            --description "Opt PR into HF Agent review automation" \
            --color "0E8A16" \
            --force
          gh label create "hf-agent:paused" \
            --repo "${KREW_REPO}" \
            --description "Pause HF Agent mutations for this PR" \
            --color "B60205" \
            --force
          gh label create "hf-agent:needs-human" \
            --repo "${KREW_REPO}" \
            --description "HF Agent needs human follow-up" \
            --color "D93F0B" \
            --force

      - name: Create translation PR
        working-directory: translation-flow
        run: |
          args=(
            --date "${{ steps.date.outputs.value }}"
            --timezone "Asia/Seoul"
            --target-worktree "../target-repo"
            --target-repo "${KREW_REPO}"
            --translator "openai"
            --skip-existing
            --allow-untracked
            --run-summary "../run-summary.json"
          )
          if [ -n "${{ inputs.post_url }}" ]; then
            args+=(--post-url "${{ inputs.post_url }}")
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run --no-pr --no-push)
          fi
          python scripts/create_translation_pr.py "${args[@]}"

      - name: Notify Discord about translation PR
        if: ${{ inputs.dry_run != true && env.DISCORD_WEBHOOK_URL != '' }}
        run: python scripts/notify_discord.py --summary run-summary.json

      - name: Generate SEO and quality reports
        if: ${{ inputs.dry_run != true }}
        run: python scripts/generate_review_reports.py --summary run-summary.json --target-root target-repo

      - name: Post quality report PR comments
        if: ${{ inputs.dry_run != true && env.GH_TOKEN != '' }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          marker = "<!-- hf-workflow-quality-report -->"
          summary_path = Path("run-summary.json")
          if not summary_path.exists():
              print("No run summary found; skipping PR comments.")
              raise SystemExit(0)
          if not os.environ.get("GH_TOKEN"):
              print("GH_TOKEN is empty; skipping PR comments.")
              raise SystemExit(0)

          summary = json.loads(summary_path.read_text())
          for result in summary["results"]:
              pr_url = result.get("pr_url") or ""
              if result.get("status") != "created" or not pr_url:
                  continue
              match = re.search(r"github\.com/([^/]+/[^/]+)/pull/(\d+)", pr_url)
              if not match:
                  print(f"Could not parse PR URL; skipping: {pr_url}")
                  continue
              repo, pr_number = match.groups()
              report_dir = Path("reports") / f"pr-{pr_number}"
              comment_path = report_dir / "pr-comment.md"
              if not comment_path.exists():
                  print(f"No PR comment report found; skipping: {comment_path}")
                  continue

              body = marker + "\n" + comment_path.read_text(encoding="utf-8")
              comments = json.loads(
                  subprocess.check_output(
                      ["gh", "api", f"repos/{repo}/issues/{pr_number}/comments"],
                      text=True,
                  )
              )
              existing = next(
                  (comment for comment in comments if marker in (comment.get("body") or "")),
                  None,
              )
              if existing:
                  subprocess.run(
                      [
                          "gh",
                          "api",
                          f"repos/{repo}/issues/comments/{existing['id']}",
                          "-X",
                          "PATCH",
                          "-f",
                          f"body={body}",
                      ],
                      check=True,
                  )
                  print(f"Updated quality comment on {pr_url}")
              else:
                  subprocess.run(
                      [
                          "gh",
                          "api",
                          f"repos/{repo}/issues/{pr_number}/comments",
                          "-f",
                          f"body={body}",
                      ],
                      check=True,
                  )
                  print(f"Created quality comment on {pr_url}")
          PY

      - name: Commit manifests and reports
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add reports
          if git diff --cached --quiet; then
            echo "No manifest or report changes to commit."
          else
            git commit -m "Add HF blog workflow reports for ${{ steps.date.outputs.value }}"
            git push
          fi

      - name: Upload run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hf-workflow-${{ steps.date.outputs.value }}
          path: |
            run-summary.json
            reports/**

      - name: Enforce quality gate on target PR
        if: ${{ inputs.dry_run != true }}
        run: python scripts/enforce_quality_gate.py --summary run-summary.json --reports-root reports --target-root target-repo
