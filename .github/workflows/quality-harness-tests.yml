name: Quality Harness Tests

on:
  pull_request:
    paths:
      - "conftest.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/**"
      - "scripts/**"
      - "skills/quality/**"
      - "skills/seo/**"
      - "translation-flow/**"
      - "tests/**"
  push:
    branches:
      - main
    paths:
      - "conftest.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/**"
      - "scripts/**"
      - "skills/quality/**"
      - "skills/seo/**"
      - "translation-flow/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install -e "skills/quality[dev]"
          python -m pip install "pyyaml>=6" "markdown>=3.4" "beautifulsoup4>=4.12"
          python -m pip install -e "translation-flow[dev]"
      - name: Run quality harness and workflow tests
        run: python -m pytest -q
